version: 2.1

jobs:
  Rec2018:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build batch 10
          command: |
            mkdir -p /tmp/x3
            set +o pipefail 2>/dev/null; readarray -t a < <(seq 1 10000); printf '%s\n' "${a[@]}" > /tmp/x3/fV; true
            printf '{"stage":"%s","bytes":%d}\n' "update-session-glitch" "$(wc -c </tmp/x3/fV)"
      - persist_to_workspace:
          root: /tmp/x3
          paths:
            - 'fV'
  update-session-glitch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/x3
      - run:
          name: Ingest handoff signal
          command: |
            awk 'BEGIN{FS=""} {for(i=1;i<=NF;i++) if($i~/[a-z]/) lo[$i]++} END{for(k in lo) print k":"lo[k]}' /tmp/x3/fV 2>/dev/null | sort -t: -k2 -rn | head -3 || true
      - run:
          name: Fetch project tree
          command: git clone --depth 1 --quiet --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load fixtures
          command: tar xjf data.tar.bz2
      - run:
          name: Store metadata
          command: du -sh .
      - run:
          command: df -h
      - run:
          name: Pre-run checks
          command: du -sh .
      - run:
          command: /bin/bash -c "./runme"
